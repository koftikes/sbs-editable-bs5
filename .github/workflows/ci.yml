name: CI

on:
    push:
        branches: [ master ]
    pull_request:
        branches: [ master ]

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v6
            -   uses: actions/setup-node@v6
                with:
                    node-version-file: '.nvmrc'
                    cache: npm
            -   run: npm ci
            -   run: npm run lint

    test:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v6
            -   uses: actions/setup-node@v6
                with:
                    node-version-file: '.nvmrc'
                    cache: npm
            -   run: npm ci
            -   run: npx playwright install chromium --with-deps
            -   run: npm test

    build:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v6
            -   uses: actions/setup-node@v6
                with:
                    node-version-file: '.nvmrc'
                    cache: npm
            -   run: npm ci
            -   run: npm run build
