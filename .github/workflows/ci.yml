name: CI

on:
    push:
        branches: [ master ]
        tags: [ 'v*.*.*' ]
    pull_request:
        branches: [ master ]

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   uses: actions/setup-node@v4
                with:
                    node-version-file: '.nvmrc'
                    cache: npm
            -   run: npm ci
            -   run: npm run lint

    typecheck:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   uses: actions/setup-node@v4
                with:
                    node-version-file: '.nvmrc'
                    cache: npm
            -   run: npm ci
            -   run: npx tsc --noEmit

    test:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   uses: actions/setup-node@v4
                with:
                    node-version-file: '.nvmrc'
                    cache: npm
            -   run: npm ci
            -   run: npx playwright install chromium --with-deps
            -   run: npm test

    build:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   uses: actions/setup-node@v4
                with:
                    node-version-file: '.nvmrc'
                    cache: npm
            -   run: npm ci
            -   run: npm run build
            -   uses: actions/upload-artifact@v4
                with:
                    name: dist
                    path: dist/
                    retention-days: 7
